<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
    <title>巴迪老师枪战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif; background: #0b0b1a; color: white; }

        /* ========== 登录界面 ========== */
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.88); z-index: 100; flex-direction: column; }
        #ui-overlay.hidden { display: none; }
        .ui-box { background: rgba(20,30,60,0.95); padding: 32px 40px; border-radius: 30px; border: 1px solid rgba(34,197,94,0.25); box-shadow: 0 20px 60px rgba(0,0,0,0.8); max-width: 440px; width: 92%; text-align: center; }
        .ui-box h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #22c55e; letter-spacing: 2px; }
        .ui-box p { color: #94a3b8; margin-bottom: 16px; font-size: 13px; }
        .ui-box input { width: 100%; padding: 11px 16px; border: none; border-radius: 40px; background: #1e293b; color: white; font-size: 15px; margin-bottom: 12px; outline: 1px solid transparent; transition: 0.2s; }
        .ui-box input:focus { outline: 1px solid #22c55e; background: #0f172a; }
        .ui-box .btn-group { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
        .ui-box .btn { padding: 10px 24px; border: none; border-radius: 40px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; flex: 1; min-width: 100px; }
        .btn-create { background: #22c55e; color: #0f172a; box-shadow: 0 4px 0 #15803d; }
        .btn-join { background: #facc15; color: #0f172a; box-shadow: 0 4px 0 #b9910e; }
        .btn-create:disabled, .btn-join:disabled { opacity: 0.6; cursor: not-allowed; }
        .ui-box .room-code-display { background: #0f172a; padding: 12px; border-radius: 16px; font-size: 30px; font-weight: 700; letter-spacing: 6px; color: #22c55e; margin: 12px 0; border: 1px dashed #22c55e; }
        .ui-box .status-msg { font-size: 13px; color: #facc15; margin-top: 10px; min-height: 20px; }
        .ui-box .error-msg { color: #ff6b6b; }
        .mode-toggle { display: flex; gap: 10px; margin-top: 16px; justify-content: center; }
        .mode-toggle button { padding: 10px 18px; border: 2px solid rgba(100,116,139,0.4); background: rgba(15,23,42,0.6); color: #94a3b8; font-size: 14px; font-weight: 600; border-radius: 30px; cursor: pointer; transition: all 0.15s; }
        .mode-toggle button.active { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,0.15); }

        /* 性能监控 */
        #perf-monitor { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #4ade80; font-size: 11px; font-family: monospace; padding: 3px 8px; border-radius: 6px; z-index: 200; pointer-events: none; display: none; }
        #perf-monitor.show { display: block; }

        /* ========== HUD ========== */
        #hud-top { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; font-size: 15px; font-weight: 600; }
        #hud-top .left { display: flex; gap: 16px; background: rgba(0,0,0,0.55); padding: 6px 16px; border-radius: 40px; }
        #hud-top .score { color: #ffd700; } #hud-top .hp { color: #ff6b6b; } #hud-top .username-label { color: #94a3b8; }

        #hud-ammo { position: absolute; bottom: 110px; left: 22%; transform: translateX(-50%); background: rgba(0,0,0,0.78); border: 1px solid rgba(255,255,255,0.1); border-radius: 60px; padding: 10px 24px; display: none; align-items: center; gap: 14px; z-index: 10; pointer-events: none; }
        #hud-ammo.show { display: flex; }
        #hud-ammo .gun-icon { font-size: 22px; }
        #hud-ammo .ammo-box { display: flex; align-items: baseline; gap: 4px; font-weight: 700; font-size: 18px; color: #cbd5e1; }
        #hud-ammo .ammo-current { color: #22c55e; min-width: 26px; text-align: center; }
        #hud-ammo .ammo-total { color: #64748b; } #hud-ammo .ammo-sep { color: #475569; }
        #hud-ammo .reload-progress { width: 60px; height: 4px; background: #1e293b; border-radius: 4px; overflow: hidden; display: none; }
        #hud-ammo .reload-progress.active { display: block; }
        #hud-ammo .reload-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #facc15, #f59e0b); border-radius: 4px; }

        #hud-hp { position: absolute; bottom: 110px; right: 22%; transform: translateX(50%); background: rgba(0,0,0,0.78); border: 1px solid rgba(255,255,255,0.1); border-radius: 60px; padding: 10px 24px; display: none; align-items: center; gap: 12px; z-index: 10; pointer-events: none; }
        #hud-hp.show { display: flex; }
        #hud-hp .hp-icon { font-size: 20px; }
        #hud-hp .hp-bar-bg { width: 100px; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
        #hud-hp .hp-bar-fill { height: 100%; width: 100%; background: #22c55e; }
        #hud-hp .hp-text { font-weight: 700; font-size: 16px; color: #cbd5e1; min-width: 26px; text-align: center; }

        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 8px; z-index: 12; pointer-events: auto; }
        #hotbar.show { display: flex; }
        .hotbar-slot { width: 64px; height: 64px; background: rgba(15, 23, 42, 0.8); border: 2px solid rgba(100,116,139,0.4); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; transition: all 0.15s; cursor: pointer; }
        .hotbar-slot.active { border-color: #22c55e; background: rgba(34, 197, 94, 0.18); box-shadow: 0 0 18px rgba(34,197,94,0.4); transform: scale(1.06); }
        .hotbar-slot .slot-key { position: absolute; top: 2px; left: 5px; font-size: 10px; color: #64748b; font-weight: 700; }
        .hotbar-slot.active .slot-key { color: #22c55e; }
        .hotbar-slot .slot-icon { font-size: 26px; }
        .hotbar-slot .slot-name { font-size: 9px; color: #94a3b8; margin-top: 1px; font-weight: 600; }
        .hotbar-slot .slot-cooldown { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.78); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #facc15; font-size: 14px; font-weight: 700; }
        .hotbar-slot .slot-cooldown.hidden { display: none; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #999; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; border: 1px solid rgba(255,255,255,0.3); }
        #crosshair.scoped { width: 4px; height: 4px; background: #ff4444; }
        #crosshair.hidden { display: none; }

        #chat-container { position: absolute; bottom: 200px; left: 16px; z-index: 15; pointer-events: none; max-width: 280px; width: 60%; }
        #chat-messages { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding: 6px; }
        .chat-msg { color: rgba(255,255,255,0.85); font-size: 12px; background: rgba(0,0,0,0.55); padding: 3px 10px; border-radius: 10px; word-break: break-word; display: inline-block; max-width: 100%; animation: fadeIn 0.2s; line-height: 1.4; }
        .chat-msg .sender { color: #22c55e; font-weight: 600; margin-right: 5px; } .chat-msg .sender-other { color: #ff6b6b; }
        .chat-msg.system-msg { color: #facc15; font-weight: 700; background: rgba(90, 70, 0, 0.5); border: 1px solid rgba(250,204,21,0.25); }
        .chat-msg.kill-msg { color: #ff8844; font-weight: 700; background: rgba(80, 20, 0, 0.65); border: 1px solid rgba(255, 100, 60, 0.4); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chat-input-container { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 20; display: none; width: 280px; max-width: 80%; }
        #chat-input { width: 100%; padding: 9px 14px; border: none; border-radius: 40px; background: rgba(0,0,0,0.85); color: white; font-size: 14px; outline: 2px solid #22c55e; font-family: inherit; }

        #death-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; background: rgba(80,0,0,0.6); z-index: 25; flex-direction: column; pointer-events: auto; }
        #death-overlay.show { display: flex; }
        #death-overlay h2 { font-size: 50px; color: #ff6b6b; text-shadow: 0 0 40px rgba(255,80,80,0.6); letter-spacing: 4px; }
        #death-overlay .timer { font-size: 22px; color: #facc15; margin-top: 10px; background: rgba(0,0,0,0.5); padding: 8px 26px; border-radius: 30px; font-weight: 700; }
        #death-overlay .buttons { display: flex; gap: 14px; margin-top: 22px; }
        #death-overlay button { padding: 13px 36px; font-size: 18px; font-weight: 700; border: none; border-radius: 60px; cursor: pointer; letter-spacing: 2px; }
        .spectate-btn { background: #60a5fa; color: #0f172a; box-shadow: 0 6px 0 #2563eb; }

        #spectate-hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 8px; z-index: 15; pointer-events: none; }
        #spectate-hud.show { display: flex; }
        .spectate-label { background: rgba(96, 165, 250, 0.3); border: 2px solid #60a5fa; color: #dbeafe; font-size: 17px; font-weight: 700; padding: 10px 28px; border-radius: 40px; letter-spacing: 2px; }
        .spectate-hint { font-size: 12px; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.5); padding: 4px 14px; border-radius: 20px; }

        #pause-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.82); z-index: 50; flex-direction: column; }
        #pause-overlay.show { display: flex; }
        .pause-box { background: rgba(20,30,60,0.98); padding: 30px 40px; border-radius: 28px; border: 1px solid rgba(34,197,94,0.25); text-align: center; max-width: 90%; }
        .pause-box h2 { font-size: 30px; color: #22c55e; margin-bottom: 12px; letter-spacing: 3px; }
        .pause-room { color: #22c55e; font-size: 15px; margin-bottom: 14px; font-weight: 700; background: rgba(15,23,42,0.7); padding: 8px 18px; border-radius: 12px; border: 1px dashed rgba(34,197,94,0.4); }
        .pause-room span { color: #facc15; }
        .pause-keys { background: rgba(15,23,42,0.6); padding: 10px 18px; border-radius: 14px; margin-bottom: 16px; text-align: left; color: #94a3b8; font-size: 12px; line-height: 1.7; max-width: 360px; }
        .pause-keys b { color: #e2e8f0; }
        .pause-box button { display: block; width: 200px; margin: 10px auto; padding: 11px 28px; font-size: 16px; font-weight: 700; border: none; border-radius: 50px; cursor: pointer; letter-spacing: 1px; }
        .pause-resume { background: #22c55e; color: #0f172a; box-shadow: 0 5px 0 #15803d; }
        .pause-quit { background: #ff6b6b; color: #0f172a; box-shadow: 0 5px 0 #aa3333; }

        #stance-indicator { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); color: #60a5fa; font-size: 13px; font-weight: 700; letter-spacing: 2px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10; }
        #stance-indicator.active { opacity: 1; }
        #regen-indicator { position: absolute; top: 80px; right: 16px; color: #4ade80; font-size: 12px; font-weight: 700; pointer-events: none; z-index: 10; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; opacity: 0; transition: opacity 0.3s; }
        #regen-indicator.active { opacity: 1; }

        /* ========== 手机控制 ========== */
        #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 18; display: none; }
        #mobile-controls.show { display: block; }

        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 160px; height: 160px; pointer-events: auto; touch-action: none; }
        #joystick-base { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 130px; height: 130px; border-radius: 50%; background: rgba(15, 23, 42, 0.5); border: 2px solid rgba(255,255,255,0.2); }
        #joystick-knob { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%; background: rgba(34, 197, 94, 0.55); border: 2px solid rgba(255,255,255,0.5); }

        .mobile-actions { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: auto; }
        .mobile-actions .mob-row { display: flex; gap: 10px; }

        .mob-btn { width: 58px; height: 58px; border-radius: 16px; background: rgba(15, 23, 42, 0.75); border: 2px solid rgba(255,255,255,0.25); color: white; font-size: 22px; font-weight: 700; touch-action: none; user-select: none; display: flex; align-items: center; justify-content: center; position: relative; }
        .mob-btn:active, .mob-btn.pressed { background: rgba(34, 197, 94, 0.55); border-color: #22c55e; }
        .mob-btn .mob-label { position: absolute; bottom: 3px; font-size: 9px; color: rgba(255,255,255,0.7); font-weight: 600; }
        .mob-shoot { width: 88px; height: 88px; font-size: 32px; background: rgba(239, 68, 68, 0.5); border-color: rgba(255,120,120,0.6); border-radius: 22px; }
        .mob-shoot:active, .mob-shoot.pressed { background: rgba(255, 80, 80, 0.8); border-color: #ff5252; }
        .mob-jump { background: rgba(59, 130, 246, 0.45); border-color: rgba(96,165,250,0.6); }
        .mob-sprint { background: rgba(250, 204, 21, 0.4); border-color: rgba(250,204,21,0.6); }
        .mob-ads { background: rgba(147, 51, 234, 0.45); border-color: rgba(180, 100, 255, 0.6); }
        .mob-prone { background: rgba(96, 165, 250, 0.45); border-color: rgba(96,165,250,0.6); }
        .mob-reload { background: rgba(250, 204, 21, 0.4); border-color: rgba(250,204,21,0.6); }

        @media (max-width: 700px) {
            .ui-box { padding: 22px 18px; }
            .ui-box h2 { font-size: 22px; }
            #hud-top { font-size: 12px; top: 8px; left: 8px; right: 8px; }
            #hud-top .left { padding: 4px 12px; gap: 10px; }
            #hud-ammo { left: 50%; transform: translateX(-100%); bottom: 110px; padding: 8px 16px; }
            #hud-hp { right: 50%; transform: translateX(100%); bottom: 110px; padding: 8px 16px; }
            #hud-hp .hp-bar-bg { width: 60px; }
            #hotbar { bottom: 16px; gap: 6px; }
            .hotbar-slot { width: 52px; height: 52px; }
            .hotbar-slot .slot-icon { font-size: 20px; }
            .hotbar-slot .slot-name { font-size: 8px; }
            #death-overlay h2 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div id="perf-monitor"></div>

    <div id="ui-overlay">
        <div class="ui-box">
            <h2>巴迪老师枪战</h2>
            <p>多人对战 · 创建或加入房间</p>
            <input type="text" id="usernameInput" placeholder="输入你的名字" maxlength="12" value="玩家" />
            <div id="roomSection">
                <div class="btn-group">
                    <button class="btn btn-create" id="createBtn">🚀 创建房间</button>
                    <button class="btn btn-join" id="joinBtn">🔗 加入房间</button>
                </div>
                <div style="margin-top:10px;">
                    <input type="text" id="roomCodeInput" placeholder="输入房间码 (4位数字)" maxlength="4" />
                </div>
                <div id="statusMsg" class="status-msg"></div>
                <div id="roomCodeDisplay" class="room-code-display" style="display:none;"></div>
            </div>
            <div class="mode-toggle">
                <button id="pcModeBtn" class="active">💻 电脑模式</button>
                <button id="mobileModeBtn">📱 手机模式</button>
            </div>
        </div>
    </div>

    <div id="hud-top" style="display:none;">
        <div class="left">
            <span class="username-label" id="hudUsername">👤 玩家</span>
            <span class="score">🏆 <span id="hudScore">0</span></span>
            <span class="hp">❤️ <span id="hudHp">100</span></span>
        </div>
    </div>

    <div id="hud-ammo">
        <span class="gun-icon" id="gunIcon">🔫</span>
        <div class="ammo-box">
            <span class="ammo-current" id="ammoCurrent">30</span>
            <span class="ammo-sep">/</span>
            <span class="ammo-total" id="ammoTotal">∞</span>
        </div>
        <div class="reload-progress" id="reloadProgress"><div class="reload-bar" id="reloadBar"></div></div>
    </div>

    <div id="hud-hp">
        <span class="hp-icon">❤️</span>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="hpBarFill" style="width:100%;"></div></div>
        <span class="hp-text" id="hpText">100</span>
    </div>

    <div id="hotbar">
        <div class="hotbar-slot active" data-slot="1">
            <span class="slot-key">1</span><span class="slot-icon">🔫</span><span class="slot-name">手枪</span>
        </div>
        <div class="hotbar-slot" data-slot="2">
            <span class="slot-key">2</span><span class="slot-icon">🎯</span><span class="slot-name">狙击枪</span>
        </div>
        <div class="hotbar-slot" data-slot="3">
            <span class="slot-key">3</span><span class="slot-icon">💣</span><span class="slot-name">炸弹</span>
            <div class="slot-cooldown hidden">0s</div>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="stance-indicator">🛌 趴下</div>
    <div id="regen-indicator">💚 恢复中</div>

    <div id="spectate-hud">
        <div class="spectate-label" id="spectateLabel">重生倒计时 25s</div>
        <div class="spectate-hint" id="spectateHint">WASD 移动 · 鼠标环顾四周</div>
    </div>

    <div id="chat-container"><div id="chat-messages"></div></div>
    <div id="chat-input-container"><input type="text" id="chat-input" placeholder="输入消息..." maxlength="80" /></div>

    <div id="death-overlay">
        <h2>💀 你阵亡了</h2>
        <div class="timer" id="respawnTimer">重生倒计时 25s</div>
        <div class="buttons">
            <button class="spectate-btn" id="spectateBtn">👁️ 观战</button>
        </div>
    </div>

    <div id="pause-overlay">
        <div class="pause-box">
            <h2>⏸️ 游戏暂停</h2>
            <div class="pause-room">📡 房间号: <span id="pauseRoomCode">----</span></div>
            <div class="pause-keys">
                <b>WASD</b> 移动 · <b>Shift</b> 疾跑<br/>
                <b>1/2/3/滚轮</b> 切武器 · <b>空格</b> 跳跃/爬梯<br/>
                <b>Z</b> 趴下 · <b>Y</b> 切换视角<br/>
                <b>左键</b> 射击 · <b>右键</b> 投弹/开镜<br/>
                <b>R</b> 换弹 · <b>T</b> 聊天 · <b>ESC</b> 暂停 · <b>P</b> 性能监控
            </div>
            <button class="pause-resume" id="resumeBtn">继续游戏</button>
            <button class="pause-quit" id="quitBtn">退出游戏</button>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="joystick-zone">
            <div id="joystick-base"></div>
            <div id="joystick-knob"></div>
        </div>
        <div class="mobile-actions">
            <div class="mob-row">
                <button class="mob-btn mob-prone" id="mobProne">🛌<span class="mob-label">趴下</span></button>
                <button class="mob-btn mob-reload" id="mobReload">🔄<span class="mob-label">换弹</span></button>
            </div>
            <div class="mob-row">
                <button class="mob-btn mob-sprint" id="mobSprint">💨<span class="mob-label">疾跑</span></button>
                <button class="mob-btn mob-ads" id="mobADS">🎯<span class="mob-label">开镜</span></button>
                <button class="mob-btn mob-jump" id="mobJump">⬆<span class="mob-label">跳跃</span></button>
            </div>
            <div class="mob-row">
                <button class="mob-btn mob-shoot" id="mobShoot">🔥</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ================================================================
        //  性能优化: 全局临时对象池
        // ================================================================
        const _tmpV1 = new THREE.Vector3();
        const _tmpV2 = new THREE.Vector3();
        const _tmpV3 = new THREE.Vector3();
        const _tmpV4 = new THREE.Vector3();

        const SHARED_BULLET_GEO = new THREE.SphereGeometry(0.09, 6, 6);
        const SHARED_SNIPER_BULLET_GEO = new THREE.SphereGeometry(0.12, 6, 6);
        const SHARED_BULLET_MAT = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
        const SHARED_SNIPER_BULLET_MAT = new THREE.MeshBasicMaterial({ color: 0x88ddff });
        const SHARED_BOMB_GEO = new THREE.SphereGeometry(0.18, 10, 10);
        const SHARED_BOMB_MAT = new THREE.MeshBasicMaterial({ color: 0x222222 });
        const SHARED_EXPLOSION_GEO = new THREE.SphereGeometry(1, 5, 5);

        class SoundFX {
            constructor() { this.ctx = null; try { this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
            resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
            shoot() {
                if (!this.ctx) return; this.resume();
                const bs = this.ctx.sampleRate * 0.12;
                const buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < bs; i++) {
                    const t = i / bs;
                    d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 8) * (1 - t * 0.5) * 0.7 + 0.3 * Math.sin(2 * Math.PI * 180 * i / this.ctx.sampleRate) * Math.exp(-t * 12);
                }
                const src = this.ctx.createBufferSource(); src.buffer = buf;
                const g = this.ctx.createGain(); g.gain.value = 0.25;
                const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 800; f.Q.value = 1.2;
                src.connect(f); f.connect(g); g.connect(this.ctx.destination);
                src.start(); src.stop(this.ctx.currentTime + 0.12);
            }
            sniperShot() {
                if (!this.ctx) return; this.resume();
                const bs = this.ctx.sampleRate * 0.3;
                const buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < bs; i++) {
                    const t = i / bs;
                    d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 4) * 0.8 + 0.4 * Math.sin(2 * Math.PI * 80 * i / this.ctx.sampleRate) * Math.exp(-t * 6);
                }
                const src = this.ctx.createBufferSource(); src.buffer = buf;
                const g = this.ctx.createGain(); g.gain.value = 0.35;
                const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200;
                src.connect(f); f.connect(g); g.connect(this.ctx.destination);
                src.start(); src.stop(this.ctx.currentTime + 0.3);
            }
            reload() {
                if (!this.ctx) return; this.resume();
                const click = (delay, freq, dur = 0.05) => {
                    const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
                    osc.type = 'square'; osc.frequency.value = freq; g.gain.value = 0.07;
                    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur + delay);
                    osc.connect(g); g.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + delay); osc.stop(this.ctx.currentTime + delay + dur);
                };
                click(0, 600, 0.08); click(0.15, 400, 0.06); click(0.3, 800, 0.05); click(0.45, 1200, 0.08);
            }

                if (!this.ctx) return; this.resume();
                const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, this.ctx.currentTime);

                osc.type = 'square'; osc.frequency.setValueAtTime(600, this.ctx.currentTime);

            }
            death() {

                const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, this.ctx.currentTime);

            }
            explosion() {
                if (!this.ctx) return; this.resume();
                const bs = this.ctx.sampleRate * 1.0;
                const buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < bs; i++) {
                    const t = i / bs;

                const src = this.ctx.createBufferSource(); src.buffer = buf;

                src.connect(f); f.connect(g); g.connect(this.ctx.destination);
                src.start(); src.stop(this.ctx.currentTime + 1.0);

        // ================================================================

        const houses = [];

        const playerWallBoxes = [];
        let houseLayoutData = null;
        let hasHousesData = false;

        const WALL_GEO = new THREE.BoxGeometry(1, 1, 1);
        const HOUSE_MAT = new THREE.MeshStandardMaterial({ color: 0x2a2a5a, roughness: 0.85, metalness: 0.05 });
        const ROOF_MAT = new THREE.MeshStandardMaterial({ color: 0x1a1a4a, roughness: 0.9 });
        const LADDER_MAT = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.85 });
        const LADDER_RAIL_GEO = new THREE.CylinderGeometry(0.05, 0.05, 1, 5);
        const LADDER_RUNG_GEO = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 5);

        function pushBox(mesh) {
            mesh.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(mesh);
            return {
                minX: box.min.x, maxX: box.max.x,
                minY: box.min.y, maxY: box.max.y,
                minZ: box.min.z, maxZ: box.max.z,
            };
        }

        function createLadder(cx, cz, height) {
            const g = new THREE.Group();
            for (const x of [-0.28, 0.28]) {
                const rail = new THREE.Mesh(LADDER_RAIL_GEO, LADDER_MAT);
                rail.scale.y = height;
                rail.position.set(x, height / 2, 0);
                g.add(rail);
            }
            for (let y = 0.35; y < height; y += 0.4) {
                const rung = new THREE.Mesh(LADDER_RUNG_GEO, LADDER_MAT);
                rung.rotation.z = Math.PI / 2;
                rung.position.set(0, y, 0);
                g.add(rung);
            }
            g.position.set(cx, 0, cz);
            scene.add(g);
            return g;
        }

        function createHouseLocal(cx, cz, size, windowWall = 3) {
            const wallH = 3.2, wallT = 0.5;
            const halfS = size / 2;
            const doorW = 2.4;
            const windowW = 2.4;
            const windowBottom = 1.0;
            const windowTop = 2.7;
            const wallBoxes = [];
            const meshes = [];

            function addWall(w, h, d, x, y, z, addCollision = true) {
                const mesh = new THREE.Mesh(WALL_GEO, HOUSE_MAT);
                mesh.scale.set(w, h, d);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                meshes.push(mesh);
                if (addCollision) {
                    const data = pushBox(mesh);
                    wallBoxes.push(data);
                    allWallBoxes.push(data);
                    playerWallBoxes.push(data);
                }
            }

            if (windowWall === 0) {
                const sideW = (size - windowW) / 2;
                addWall(sideW, wallH, wallT, cx - halfS + sideW / 2, wallH / 2, cz - halfS);
                addWall(sideW, wallH, wallT, cx + halfS - sideW / 2, wallH / 2, cz - halfS);
                addWall(windowW, windowBottom, wallT, cx, windowBottom / 2, cz - halfS, true);
                const upperH = wallH - windowTop;
                if (upperH > 0.01) addWall(windowW, upperH, wallT, cx, windowTop + upperH / 2, cz - halfS, false);
            } else addWall(size, wallH, wallT, cx, wallH / 2, cz - halfS);

            if (windowWall === 1) {
                const sideW = (size - windowW) / 2;
                addWall(wallT, wallH, sideW, cx - halfS, wallH / 2, cz - halfS + sideW / 2);
                addWall(wallT, wallH, sideW, cx - halfS, wallH / 2, cz + halfS - sideW / 2);
                addWall(wallT, windowBottom, windowW, cx - halfS, windowBottom / 2, cz, true);
                const upperH = wallH - windowTop;
                if (upperH > 0.01) addWall(wallT, upperH, windowW, cx - halfS, windowTop + upperH / 2, cz, false);
            } else addWall(wallT, wallH, size, cx - halfS, wallH / 2, cz);

            if (windowWall === 2) {
                const sideW = (size - windowW) / 2;
                addWall(wallT, wallH, sideW, cx + halfS, wallH / 2, cz - halfS + sideW / 2);
                addWall(wallT, wallH, sideW, cx + halfS, wallH / 2, cz + halfS - sideW / 2);
                addWall(wallT, windowBottom, windowW, cx + halfS, windowBottom / 2, cz, true);
                const upperH = wallH - windowTop;
                if (upperH > 0.01) addWall(wallT, upperH, windowW, cx + halfS, windowTop + upperH / 2, cz, false);
            } else addWall(wallT, wallH, size, cx + halfS, wallH / 2, cz);

            const sw = (size - doorW) / 2;
            addWall(sw, wallH, wallT, cx - halfS + sw / 2, wallH / 2, cz + halfS);
            addWall(sw, wallH, wallT, cx + halfS - sw / 2, wallH / 2, cz + halfS);

            const roofThickness = 0.3;
            const roofY = wallH + 0.15;
            const roofTotal = size + 0.6;
            const edge = (roofTotal - HOLE_HALF * 2) / 2;

            function addRoof(w, h, d, x, y, z) {
                const mesh = new THREE.Mesh(WALL_GEO, ROOF_MAT);
                mesh.scale.set(w, h, d);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                scene.add(mesh);
                meshes.push(mesh);
                const data = pushBox(mesh);
                allWallBoxes.push(data);
            }

            addRoof(roofTotal, roofThickness, edge, cx, roofY, cz - HOLE_HALF - edge / 2);
            addRoof(roofTotal, roofThickness, edge, cx, roofY, cz + HOLE_HALF + edge / 2);
            addRoof(edge, roofThickness, HOLE_HALF * 2, cx - HOLE_HALF - edge / 2, roofY, cz);
            addRoof(edge, roofThickness, HOLE_HALF * 2, cx + HOLE_HALF + edge / 2, roofY, cz);

            createLadder(cx, cz, wallH + 0.5);
            houses.push({ x: cx, z: cz, size, meshes, wallBoxes });
        }

        function generateHouseLayout() {
            const placed = [];
            for (let i = 0; i < 3; i++) {
                let tries = 0;
                while (tries < 60) {
                    const x = (Math.random() - 0.5) * (MAP_SIZE - 22);
                    const z = (Math.random() - 0.5) * (MAP_SIZE - 22);
                    let ok = Math.sqrt(x * x + z * z) >= 12;
                    if (ok) for (const a of placed) {
                        if (Math.sqrt((a.x - x) ** 2 + (a.z - z) ** 2) < 28) { ok = false; break; }
                    }
                    if (ok) {
                        placed.push({ x, z, size: 8, windowWall: Math.floor(Math.random() * 3) });
                        break;
                    }
                    tries++;
                }
            }
            return placed;
        }

        function buildHousesFromData(data) {

        function bulletHitsWall(prevPos, newPos) {
            const dx = newPos.x - prevPos.x;
            const dy = newPos.y - prevPos.y;
            const dz = newPos.z - prevPos.z;
            const lenSq = dx * dx + dy * dy + dz * dz;
            if (lenSq < 1e-8) return false;
            const len = Math.sqrt(lenSq);

            for (let i = 0; i < allWallBoxes.length; i++) {
                const b = allWallBoxes[i];
                let tmin = 0, tmax = len;
                if (Math.abs(dx) < 1e-8) {
                    if (prevPos.x < b.minX || prevPos.x > b.maxX) continue;
                } else {
                    const t1 = (b.minX - prevPos.x) / dx;
                    const t2 = (b.maxX - prevPos.x) / dx;
                    const tNear = Math.min(t1, t2), tFar = Math.max(t1, t2);
                    if (tNear > tmin) tmin = tNear;
                    if (tFar < tmax) tmax = tFar;
                    if (tmin > tmax) continue;
                }
                if (Math.abs(dy) < 1e-8) {
                    if (prevPos.y < b.minY || prevPos.y > b.maxY) continue;
                } else {
                    const t1 = (b.minY - prevPos.y) / dy;
                    const t2 = (b.maxY - prevPos.y) / dy;
                    const tNear = Math.min(t1, t2), tFar = Math.max(t1, t2);
                    if (tNear > tmin) tmin = tNear;
                    if (tFar < tmax) tmax = tFar;
                    if (tmin > tmax) continue;
                }
                if (Math.abs(dz) < 1e-8) {
                    if (prevPos.z < b.minZ || prevPos.z > b.maxZ) continue;
                } else {
                    const t1 = (b.minZ - prevPos.z) / dz;
                    const t2 = (b.maxZ - prevPos.z) / dz;
                    const tNear = Math.min(t1, t2), tFar = Math.max(t1, t2);
                    if (tNear > tmin) tmin = tNear;
                    if (tFar < tmax) tmax = tFar;
                    if (tmin > tmax) continue;
                }
                if (tmin >= 0 && tmin <= len) return true;
            }
            return false;
        }

        function resolveWallCollision(pos, radius, playerHeight) {
            for (let iter = 0; iter < 3; iter++) {
                let collided = false;
                for (let i = 0; i < playerWallBoxes.length; i++) {
                    const b = playerWallBoxes[i];
                    if (pos.x + radius < b.minX || pos.x - radius > b.maxX) continue;
                    if (pos.z + radius < b.minZ || pos.z - radius > b.maxZ) continue;
                    if (pos.y + playerHeight < b.minY || pos.y > b.maxY) continue;
                    const overlapX = Math.min(pos.x + radius, b.maxX) - Math.max(pos.x - radius, b.minX);
                    const overlapZ = Math.min(pos.z + radius, b.maxZ) - Math.max(pos.z - radius, b.minZ);
                    if (overlapX < overlapZ) {
                        const pcx = pos.x;
                        const bcx = (b.minX + b.maxX) / 2;
                        pos.x += pcx > bcx ? overlapX : -overlapX;
                    } else {
                        const pcz = pos.z;
                        const bcz = (b.minZ + b.maxZ) / 2;
                        pos.z += pcz > bcz ? overlapZ : -overlapZ;
                    }
                    collided = true;
                }
                if (!collided) break;
            }
        }

        }

        function updateWalkAnimation(playerObj, isMoving, delta, isSprinting) {
            if (!playerObj || !playerObj.meshData || playerObj.isDead) return;
            if (playerObj !== players[localPeerId]) {
                const dx = playerObj.position.x - camera.position.x;
                const dz = playerObj.position.z - camera.position.z;
                if (dx * dx + dz * dz > WALK_ANIM_DISTANCE * WALK_ANIM_DISTANCE) return;
            }

            const data = playerObj.meshData;
            if (!playerObj._walkPhase) playerObj._walkPhase = 0;
            if (isMoving) {
                const speed = isSprinting ? 20 : 12;
                const swingAmt = isSprinting ? 0.8 : 0.5;
                playerObj._walkPhase += delta * speed;
                const swing = Math.sin(playerObj._walkPhase) * swingAmt;
                if (data.legL) data.legL.rotation.x = swing;
                if (data.legR) data.legR.rotation.x = -swing;
                if (data.leftArmPivot) data.leftArmPivot.rotation.x = -swing * 0.9;
            } else {
                if (data.legL) data.legL.rotation.x *= 0.85;
                if (data.legR) data.legR.rotation.x *= 0.85;
                if (data.leftArmPivot) data.leftArmPivot.rotation.x *= 0.85;

        function isLabelOccluded(labelWorldPos, camPos) {
            const dx = labelWorldPos.x - camPos.x;
            const dy = labelWorldPos.y - camPos.y;
            const dz = labelWorldPos.z - camPos.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            if (distSq < 0.01) return false;
            const dist = Math.sqrt(distSq);
            const invDist = 1 / dist;
            const nx = dx * invDist, ny = dy * invDist, nz = dz * invDist;

            for (let i = 0; i < allWallBoxes.length; i++) {
                const b = allWallBoxes[i];
                let tmin = 0, tmax = dist;
                if (Math.abs(nx) < 1e-8) {
                    if (camPos.x < b.minX || camPos.x > b.maxX) continue;
                } else {
                    const t1 = (b.minX - camPos.x) / nx;
                    const t2 = (b.maxX - camPos.x) / nx;
                    const tNear = Math.min(t1, t2), tFar = Math.max(t1, t2);
                    if (tNear > tmin) tmin = tNear;
                    if (tFar < tmax) tmax = tFar;
                    if (tmin > tmax) continue;
                }
                if (Math.abs(ny) < 1e-8) {
                    if (camPos.y < b.minY || camPos.y > b.maxY) continue;
                } else {
                    const t1 = (b.minY - camPos.y) / ny;
                    const t2 = (b.maxY - camPos.y) / ny;
                    const tNear = Math.min(t1, t2), tFar = Math.max(t1, t2);
                    if (tNear > tmin) tmin = tNear;
                    if (tFar < tmax) tmax = tFar;
                    if (tmin > tmax) continue;
                }
                if (Math.abs(nz) < 1e-8) {
                    if (camPos.z < b.minZ || camPos.z > b.maxZ) continue;
                } else {
                    const t1 = (b.minZ - camPos.z) / nz;
                    const t2 = (b.maxZ - camPos.z) / nz;
                    const tNear = Math.min(t1, t2), tFar = Math.max(t1, t2);
                    if (tNear > tmin) tmin = tNear;
                    if (tFar < tmax) tmax = tFar;
                    if (tmin > tmax) continue;
                }
                if (tmin >= 0 && tmin < dist - 0.3) return true;
            }
            return false;
        }

        const bullets = [];

        function segmentIntersectsSphere(p1, p2, center, radius) {
            const dx = p2.x - p1.x, dy = p2.y - p1.y, dz = p2.z - p1.z;
            const fx = p1.x - center.x, fy = p1.y - center.y, fz = p1.z - center.z;
            const a = dx * dx + dy * dy + dz * dz;
            if (a < 1e-8) return (fx * fx + fy * fy + fz * fz) <= radius * radius;
            const b = 2 * (fx * dx + fy * dy + fz * dz);
            const c = fx * fx + fy * fy + fz * fz - radius * radius;
            const disc = b * b - 4 * a * c;
            if (disc < 0) return false;
            const sqrtD = Math.sqrt(disc);
            const t1 = (-b - sqrtD) / (2 * a);
            const t2 = (-b + sqrtD) / (2 * a);
            return (t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1) || (t1 < 0 && t2 > 1);
        }

        function createBullet(origin, direction, ownerId, speed, damage, isSniper) {
            const geo = isSniper ? SHARED_SNIPER_BULLET_GEO : SHARED_BULLET_GEO;
            const mat = isSniper ? SHARED_SNIPER_BULLET_MAT : SHARED_BULLET_MAT;
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(origin);
            scene.add(mesh);
            const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
                color: isSniper ? 0x88ddff : 0xffaa44,
                transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false,
            }));
            glowSprite.scale.set(0.5, 0.5, 0.5);
            glowSprite.position.copy(origin);
            scene.add(glowSprite);

            bullets.push({
                mesh, glowSprite,
                ownerId, life: 200,
                prevPos: origin.clone(),
                damage, isSniper,
                _vx: direction.x * speed,
                _vy: direction.y * speed,
                _vz: direction.z * speed,
            });
        }

        function updateBullets(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.prevPos.set(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z);
                b.mesh.position.x += b._vx * delta;
                b.mesh.position.y += b._vy * delta;
                b.mesh.position.z += b._vz * delta;
                b.glowSprite.position.copy(b.mesh.position);
                b.life--;
                let removed = false;

                if (bulletHitsWall(b.prevPos, b.mesh.position)) {
                    scene.remove(b.mesh); scene.remove(b.glowSprite);
                    bullets.splice(i, 1); continue;
                }

                for (const pid in players) {
                    if (pid === b.ownerId) continue;
                    const target = players[pid];
                    if (target.isDead) continue;
                    if (performance.now() < (target.invulnerableUntil || 0)) continue;
                    _tmpV1.set(target.position.x, target.position.y + 0.9, target.position.z);
                    if (segmentIntersectsSphere(b.prevPos, b.mesh.position, _tmpV1, 1.0)) {
                        const hpBefore = target.hp;
                        target.hp -= b.damage;
                        if (target.hp < 0) target.hp = 0;
                        sound.hit();
                        if (pid === localPeerId) {
                            GameState.hitShake = 0.35;
                            GameState.lastDamageTime = performance.now();
                        }
                        if (target.meshData && target.meshData.hpFill) {
                            const p = Math.max(0, target.hp);
                            target.meshData.hpFill.style.width = p + '%';
                            target.meshData.hpFill.style.background = p > 60 ? '#22c55e' : p > 30 ? '#facc15' : '#ff6b6b';
                        }
                        if (target.hp <= 0 && hpBefore > 0) {
                            target.isDead = true;
                            const killer = players[b.ownerId];
                            if (killer) { killer.score += 5; if (b.ownerId === localPeerId) updateHUD(); }
                            const killerName = killer ? killer.username : '???';
                            const weaponName = b.isSniper ? '狙击枪' : '手枪';
                            addKillMessage(target.username, killerName, weaponName, false);
                            if (conn && conn.open) {
                                conn.send({ type: 'kill_msg', victim: target.username, killer: killerName, weapon: weaponName, isBomb: false });
                                conn.send({ type: 'death', peerId: pid, killerId: b.ownerId });
                            }
                            if (pid === localPeerId) triggerDeath();
                            else setPlayerDeathVisual(target, true);
                        }
                        scene.remove(b.mesh); scene.remove(b.glowSprite);
                        bullets.splice(i, 1); removed = true; break;
                    }
                }
                if (!removed && (b.life <= 0 || Math.abs(b.mesh.position.x) > HALF_MAP || Math.abs(b.mesh.position.z) > HALF_MAP)) {
                    scene.remove(b.mesh); scene.remove(b.glowSprite);
                    bullets.splice(i, 1);
                }
            }
        }

        const bombs = [];

        function createBombMesh() {
            const g = new THREE.Group();
            const ball = new THREE.Mesh(SHARED_BOMB_GEO, SHARED_BOMB_MAT);
            ball.castShadow = true; g.add(ball);
            const led = new THREE.Mesh(new THREE.SphereGeometry(0.035, 4, 4), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
            led.position.y = 0.18; g.add(led);
            return { group: g, led };
        }

        function throwBomb(origin, direction, ownerId) {
            const bm = createBombMesh();
            bm.group.position.copy(origin);
            scene.add(bm.group);
            const vel = direction.clone().multiplyScalar(18);
            vel.y += 6;
            bombs.push({
                mesh: bm.group, led: bm.led,
                velocity: vel, ownerId, life: 180,
                prevPos: origin.clone(),
            });
        }

        function updateBombs(delta) {
            for (let i = bombs.length - 1; i >= 0; i--) {
                const b = bombs[i];
                b.prevPos.copy(b.mesh.position);
                b.velocity.y -= 22 * delta;
                b.mesh.position.x += b.velocity.x * delta;
                b.mesh.position.y += b.velocity.y * delta;
                b.mesh.position.z += b.velocity.z * delta;
                b.life--;
                const blink = Math.sin(performance.now() * 0.02) > 0 ? 1 : 0.15;
                b.led.material.color.setRGB(blink, 0, 0);

                let explode = false;
                if (b.mesh.position.y <= 0.15) { b.mesh.position.y = 0.15; explode = true; }
                if (bulletHitsWall(b.prevPos, b.mesh.position)) explode = true;
                if (b.life <= 0) explode = true;

                if (explode) {
                    const pos = b.mesh.position.clone();
                    scene.remove(b.mesh);
                    bombs.splice(i, 1);
                    applyExplosion(pos, b.ownerId);
                }
            }
        }

        function applyExplosion(position, ownerId) {
            emitExplosionParticles(position);
            sound.explosion();

            const local = players[localPeerId];
            if (local) {
                const d = local.position.distanceTo(position);
                if (d < 15) GameState.hitShake = Math.min(1.0, 1.0 * (1 - d / 15));
            }

            if (ownerId === localPeerId) {
                for (const pid in players) {
                    const target = players[pid];
                    if (target.isDead) continue;
                    if (performance.now() < (target.invulnerableUntil || 0)) continue;
                    const targetCenter = target.position.clone().add(new THREE.Vector3(0, 0.9, 0));
                    const d = targetCenter.distanceTo(position);
                    let dmg = 0;
                    if (d < 4) dmg = 999;
                    else if (d < 8) dmg = 100 * (1 - (d - 4) / 4);
                    else continue;

                    const hpBefore = target.hp;
                    target.hp -= dmg;
                    if (target.hp < 0) target.hp = 0;
                    if (pid === localPeerId) {
                        GameState.hitShake = 0.8;
                        GameState.lastDamageTime = performance.now();
                    }
                    if (target.meshData && target.meshData.hpFill) {
                        const p = Math.max(0, target.hp);
                        target.meshData.hpFill.style.width = p + '%';
                        target.meshData.hpFill.style.background = p > 60 ? '#22c55e' : p > 30 ? '#facc15' : '#ff6b6b';
                    }
                    if (target.hp <= 0 && hpBefore > 0) {
                        target.isDead = true;
                        const killer = players[ownerId];
                        if (killer) { killer.score += 5; if (ownerId === localPeerId) updateHUD(); }
                        const killerName = killer ? killer.username : '???';
                        addKillMessage(target.username, killerName, '', true);
                        if (conn && conn.open) {
                            conn.send({ type: 'kill_msg', victim: target.username, killer: killerName, isBomb: true });
                            conn.send({ type: 'death', peerId: pid, killerId: ownerId });
                        }
                        if (pid === localPeerId) triggerDeath();
                        else setPlayerDeathVisual(target, true);
                    }
                }
                if (conn && conn.open) conn.send({ type: 'bomb_explode', position: position.toArray(), ownerId });
            }
        }

        const explosions = [];
        function emitExplosionParticles(position) {
            const count = 40;
            for (let i = 0; i < count; i++) {
                const dir = _tmpV1.set(Math.random() - 0.5, Math.random() * 0.9, Math.random() - 0.5).normalize();
                const speed = 6 + Math.random() * 12;
                const matIdx = Math.floor(Math.random() * 3);
                const mesh = new THREE.Mesh(SHARED_EXPLOSION_GEO, SHARED_PARTICLE_MAT_POOL[matIdx].clone());
                mesh.position.copy(position);
                mesh.scale.setScalar(0.15 + Math.random() * 0.15);
                scene.add(mesh);
                explosions.push({
                    mesh,
                    vx: dir.x * speed, vy: dir.y * speed, vz: dir.z * speed,
                    life: 40 + Math.random() * 30, maxLife: 70,
                });
            }
        }

        function updateExplosions(delta) {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const e = explosions[i];
                e.mesh.position.x += e.vx * delta;
                e.mesh.position.y += e.vy * delta;
                e.mesh.position.z += e.vz * delta;
                e.vy -= 12 * delta;
                e.vx *= 0.95; e.vy *= 0.95; e.vz *= 0.95;
                e.life--;
                const alpha = Math.max(0, e.life / e.maxLife);
                e.mesh.material.opacity = alpha;
                e.mesh.scale.setScalar(Math.max(0.05, alpha * 0.2));
                if (e.life <= 0) {
                    scene.remove(e.mesh);
                    e.mesh.material.dispose();
                    explosions.splice(i, 1);
                }
            }
        }

        function clearJoinTimeout() {
            if (joinTimeout) { clearTimeout(joinTimeout); joinTimeout = null; }
        }

        function cleanupPeer() {
            if (conn) { try { conn.close(); } catch (e) {} conn = null; }
            if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
            clearJoinTimeout();
        }

        function setStatus(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.className = 'status-msg' + (isError ? ' error-msg' : '');
        }
        function generateRoomCode() { return String(1000 + Math.floor(Math.random() * 9000)); }

        createBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim() || '玩家';
            if (username.length < 2) { setStatus('名字至少2个字符', true); return; }

            cleanupPeer();

            const code = generateRoomCode();
            roomCode = code; GameState.username = username; GameState.roomCode = code;
            GameState.isHost = true; isHost = true;

            try {
                peer = new Peer(code, PEER_CONFIG);

                const createTimeout = setTimeout(() => {
                    if (!peer || !peer.open) {
                        setStatus('连接信令服务器超时，请检查网络', true);
                        createBtn.disabled = false;
                        joinBtn.disabled = false;
                        cleanupPeer();
                    }
                }, 10000);

                peer.on('open', (id) => {
                    clearTimeout(createTimeout);
                    localPeerId = id;

                    buildHousesFromData(houseLayoutData);

                    setStatus(`房间已创建 (房间码: ${code})，等待玩家加入...`);

                    peer.on('connection', (incomingConn) => {

                            incomingConn.close();

                        }
                        conn = incomingConn;
                        setupConnection(conn, false);
                    });

                    createBtn.disabled = true;
                    joinBtn.disabled = true;
                    createBtn.textContent = '⏳ 等待对手...';
                    addLocalPlayer(username);
                    enterGame();
                    addSystemMessage(`房间 ${code} 已创建，等待玩家加入...`);
                });

                peer.on('error', (err) => {
                    clearTimeout(createTimeout);
                    console.error('Peer 错误:', err);

                    if (err.type === 'unavailable-id') {
                        setStatus('房间码冲突，请再点一次创建', true);
                    } else if (err.type === 'network' || err.type === 'server-error') {
                        setStatus('信令服务器连接失败，请检查网络或稍后重试', true);
                    } else if (err.type === 'browser-incompatible') {
                        setStatus('浏览器不支持 WebRTC，请用 Chrome/Safari', true);
                    } else {
                        setStatus('创建失败: ' + err.message, true);
                    }

                    createBtn.disabled = false;
                    joinBtn.disabled = false;
                    createBtn.textContent = '🚀 创建房间';
                    cleanupPeer();
                });

                peer.on('disconnected', () => {
                    if (!peer.destroyed) {
                        try { peer.reconnect(); } catch (e) {}
                    }
                });

            } catch (e) {
                setStatus('创建失败: ' + e.message, true);
                cleanupPeer();
            }
        });

        joinBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim() || '玩家';
            if (username.length < 2) { setStatus('名字至少2个字符', true); return; }
            const code = roomCodeInput.value.trim();
            if (!/^\d{4}$/.test(code)) { setStatus('请输入4位数字房间码', true); return; }

            cleanupPeer();

            roomCode = code;
            GameState.username = username;
            GameState.roomCode = code;
            GameState.isHost = false;
            isHost = false;

            setStatus('正在连接房间...');
            joinBtn.disabled = true;
            createBtn.disabled = true;

            const myId = 'player_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);

            try {
                peer = new Peer(myId, PEER_CONFIG);

                joinTimeout = setTimeout(() => {
                    if (!conn || !conn.open) {
                        setStatus('连接超时。房主可能已离线或房间码错误', true);
                        joinBtn.disabled = false;
                        createBtn.disabled = false;
                        cleanupPeer();
                    }
                }, 15000);

                peer.on('open', (id) => {
                    localPeerId = id;
                    setStatus('正在建立 P2P 连接...');

                    conn = peer.connect(code, {
                        reliable: true,
                        metadata: { username: GameState.username },
                    });

                    conn.on('error', (err) => {
                        console.error('连接错误:', err);
                        clearJoinTimeout();
                        setStatus('连接失败：房主可能已离线', true);
                        joinBtn.disabled = false;
                        createBtn.disabled = false;
                    });

                    setupConnection(conn, true);
                });

                peer.on('error', (err) => {
                    clearJoinTimeout();
                    console.error('Peer 错误:', err);
                    joinBtn.disabled = false;
                    createBtn.disabled = false;

                    if (err.type === 'peer-unavailable') {
                        setStatus('房间不存在或房主已离线', true);
                    } else if (err.type === 'network' || err.type === 'server-error') {
                        setStatus('信令服务器连接失败，请检查网络', true);
                    } else if (err.type === 'browser-incompatible') {
                        setStatus('浏览器不支持 WebRTC，请用 Chrome/Safari', true);
                    } else {
                        setStatus('连接失败: ' + err.message, true);
                    }
                    cleanupPeer();
                });

                peer.on('disconnected', () => {
                    if (!peer.destroyed && (!conn || !conn.open)) {
                        try { peer.reconnect(); } catch (e) {}
                    }
                });

            } catch (e) {
                clearJoinTimeout();
                setStatus('加入失败: ' + e.message, true);
                joinBtn.disabled = false;
                createBtn.disabled = false;
            }
        });

        function enterGame() {
            uiOverlay.classList.add('hidden');
            hudTop.style.display = 'flex';
            hudAmmo.classList.add('show');
            hudHpEl.classList.add('show');
            hotbar.classList.add('show');
            pauseRoomCode.textContent = roomCode;

            if (GameState.mobileMode) {
                mobileControls.classList.add('show');
                GameState.isLocked = true;
                document.body.classList.add('mobile-mode');
            } else {
                renderer.domElement.click();
            }

            if (!window.gameLoopStarted) { window.gameLoopStarted = true; animate(); }
        }

        function setupConnection(connection, isJoiner) {
            conn = connection;

            conn.on('open', () => {
                clearJoinTimeout();
                setStatus('已连接！游戏开始！');
                conn.send({ type: 'join', username: GameState.username, peerId: localPeerId });
                if (isJoiner) addLocalPlayer(GameState.username);
                else if (!GameState.mobileMode) renderer.domElement.click();
            });

            conn.on('data', handleNetworkMessage);

            conn.on('error', (err) => {
                console.error('连接错误:', err);
                setStatus('连接错误：' + err.message, true);
            });

            conn.on('close', () => {
                if (!isHost) {
                    quitToMainMenu('房主已关闭房间');
                } else {
                    for (const pid in players) {
                        if (pid !== localPeerId) {
                            const p = players[pid];
                            if (p) addSystemMessage(`${p.username} 离开了房间`);
                            if (p && p.mesh) scene.remove(p.mesh);
                            delete players[pid];
                        }
                    }
                    conn = null;
                }
            });
        }

        function addLocalPlayer(username) {
            const meshData = createPlayerMesh(username, true);
            scene.add(meshData.group);
            players[localPeerId] = {
                username, peerId: localPeerId,
                mesh: meshData.group, meshData,
                position: new THREE.Vector3(0, 0, 0),
                rotation: new THREE.Euler(0, 0, 0),
                hp: 100, score: 0, isLocal: true, isDead: false,
                invulnerableUntil: performance.now() + INVULN_DURATION,

            };
            GameState.localPlayerId = localPeerId;
            GameState.localPlayer = players[localPeerId];

        function addRemotePlayer(peerId, username) {
            if (players[peerId]) return;
            const meshData = createPlayerMesh(username, false);
            scene.add(meshData.group);
            players[peerId] = {
                username, peerId,
                mesh: meshData.group, meshData,
                position: new THREE.Vector3(0, 0, 0),
                rotation: new THREE.Euler(0, 0, 0),
                hp: 100, score: 0, isLocal: false, isDead: false,
                invulnerableUntil: performance.now() + INVULN_DURATION,
                currentSlot: 1,
            };

        function triggerDeath() {
            if (GameState.isDead) return;
            GameState.isDead = true;
            sound.death();
            GameState.spectating = false;
            spectateHud.classList.remove('show');
            crosshair.classList.remove('hidden');
            if (document.pointerLockElement && !GameState.mobileMode) document.exitPointerLock();
            if (GameState._respawnTimer) { clearTimeout(GameState._respawnTimer); GameState._respawnTimer = null; }
            if (GameState._countdownInterval) { clearInterval(GameState._countdownInterval); GameState._countdownInterval = null; }

            deathOverlay.classList.add('show');
            let count = Math.floor(RESPAWN_TIME / 1000);
            respawnTimer.textContent = `重生倒计时 ${count}s`;
            GameState._countdownInterval = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(GameState._countdownInterval);
                    GameState._countdownInterval = null;
                    respawnTimer.textContent = '重生倒计时 0s';
                } else {
                    respawnTimer.textContent = `重生倒计时 ${count}s`;
                    if (GameState.spectating) spectateLabel.textContent = `重生倒计时 ${count}s`;
                }
            }, 1000);

            GameState._respawnTimer = setTimeout(() => {
                GameState._respawnTimer = null;
                if (GameState._countdownInterval) { clearInterval(GameState._countdownInterval); GameState._countdownInterval = null; }
                respawnLocal();
            }, RESPAWN_TIME);
        }

        function enterSpectate() {
            if (!GameState.isDead) return;
            GameState.spectating = true;
            deathOverlay.classList.remove('show');
            spectateHud.classList.add('show');
            crosshair.classList.add('hidden');
            spectateLabel.textContent = respawnTimer.textContent;
            if (!GameState.mobileMode) renderer.domElement.requestPointerLock();
            else GameState.isLocked = true;
        }

        function exitSpectate() {
            GameState.spectating = false;
            spectateHud.classList.remove('show');
            crosshair.classList.remove('hidden');
        }

        function respawnLocal() {
            if (GameState._respawnTimer) { clearTimeout(GameState._respawnTimer); GameState._respawnTimer = null; }
            if (GameState._countdownInterval) { clearInterval(GameState._countdownInterval); GameState._countdownInterval = null; }
            const p = players[localPeerId];
            if (!p) return;
            exitSpectate();
            p.isDead = false; p.hp = 100; GameState.isDead = false;
            p.invulnerableUntil = performance.now() + INVULN_DURATION;

            let px = 0, pz = 0, ok = false, tries = 0;
            while (!ok && tries < 40) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 8 + Math.random() * 30;
                px = Math.cos(angle) * dist; pz = Math.sin(angle) * dist;

        function handleNetworkMessage(data) {
            switch (data.type) {
                case 'join': {
                    const { username, peerId } = data;
                    if (peerId !== localPeerId) {
                        addRemotePlayer(peerId, username);
                        addSystemMessage(`${username} 加入了房间`);
                        if (isHost) {
                            if (houseLayoutData) conn.send({ type: 'houses_data', houses: houseLayoutData });
                            for (const pid in players) {
                                const p = players[pid];
                                conn.send({ type: 'sync_player', peerId: pid, username: p.username, position: p.position.toArray(), hp: p.hp, score: p.score });
                            }
                        }
                    }
                    break;
                }
                case 'houses_data': {
                    if (!hasHousesData) {
                        hasHousesData = true;
                        houseLayoutData = data.houses;
                        buildHousesFromData(data.houses);
                        enterGame();
                        addSystemMessage(`已加入房间 ${roomCode}`);
                        if (!GameState.mobileMode) renderer.domElement.click();
                    }
                    break;
                }
                case 'sync_player': {
                    const { peerId, username, position, hp, score } = data;
                    if (!players[peerId]) addRemotePlayer(peerId, username);
                    const p = players[peerId];
                    if (p) {
                        p.position.fromArray(position); p.mesh.position.copy(p.position);
                        p.hp = hp; p.score = score;
                        if (p.meshData && p.meshData.hpFill) {
                            const percent = Math.max(0, hp);
                            p.meshData.hpFill.style.width = percent + '%';
                            p.meshData.hpFill.style.background = hp > 60 ? '#22c55e' : hp > 30 ? '#facc15' : '#ff6b6b';
                        }
                    }
                    break;
                }
                case 'move': {
                    const player = players[data.peerId];
                    if (player && data.peerId !== localPeerId && !player.isDead) {
                        const oldX = player.position.x, oldZ = player.position.z;
                        player.position.fromArray(data.position);
                        player.mesh.position.copy(player.position);
                        if (data.rotation) player.mesh.rotation.set(data.rotation[0], data.rotation[1], data.rotation[2]);
                        const dx = player.position.x - oldX, dz = player.position.z - oldZ;
                        player._isMoving = (dx * dx + dz * dz) > 0.0025;
                        player._isSprinting = data.isSprinting || false;
                    }
                    break;
                }
                case 'switch': {
                    const player = players[data.peerId];
                    if (player && data.peerId !== localPeerId) {
                        player.currentSlot = data.slot;
                        setPlayerWeaponVisual(player, data.slot);
                    }
                    break;
                }
                case 'shoot': {
                    if (data.peerId !== localPeerId) {
                        const damage = data.isSniper ? WEAPONS[2].damage : WEAPONS[1].damage;
                        const speed = data.isSniper ? WEAPONS[2].bulletSpeed : WEAPONS[1].bulletSpeed;
                        createBullet(new THREE.Vector3().fromArray(data.origin), new THREE.Vector3().fromArray(data.direction), data.peerId, speed, damage, data.isSniper);
                    }
                    break;
                }
                case 'bomb_throw': {
                    if (data.peerId !== localPeerId) {
                        throwBomb(new THREE.Vector3().fromArray(data.origin), new THREE.Vector3().fromArray(data.direction), data.peerId);
                    }
                    break;
                }
                case 'bomb_explode': {
                    if (data.ownerId !== localPeerId) {
                        const pos = new THREE.Vector3().fromArray(data.position);
                        emitExplosionParticles(pos);
                        sound.explosion();
                        const local = players[localPeerId];
                        if (local) {
                            const d = local.position.distanceTo(pos);
                            if (d < 15) GameState.hitShake = Math.min(1.0, 1.0 * (1 - d / 15));
                        }
                    }
                    break;
                }
                case 'kill_msg': {
                    if (data.victim !== GameState.username || data.killer !== GameState.username) {
                        addKillMessage(data.victim, data.killer, data.weapon, data.isBomb);
                    }
                    break;
                }
                case 'death': {
                    const target = players[data.peerId];
                    if (target) {
                        target.isDead = true; target.hp = 0;
                        if (data.peerId !== localPeerId) setPlayerDeathVisual(target, true);
                        if (data.killerId === localPeerId) {
                            const local = players[localPeerId];
                            if (local) { local.score += 5; updateHUD(); }
                        }
                    }
                    if (data.peerId === localPeerId) triggerDeath();
                    break;
                }
                case 'respawn': {
                    const p = players[data.peerId];
                    if (p) {
                        p.isDead = false; p.hp = 100;
                        p.position.fromArray(data.position);
                        setPlayerDeathVisual(p, false);
                        p.mesh.position.copy(p.position);
                        p.mesh.rotation.set(0, 0, 0);
                        p.invulnerableUntil = performance.now() + INVULN_DURATION;
                        if (p.meshData && p.meshData.hpFill) {
                            p.meshData.hpFill.style.width = '100%';
                            p.meshData.hpFill.style.background = '#22c55e';
                        }
                    }
                    break;
                }
                case 'leave': {
                    const p = players[data.peerId];
                    if (p) {
                        addSystemMessage(`${p.username} 离开了房间`);
                        if (p.mesh) scene.remove(p.mesh);
                        delete players[data.peerId];
                    }
                    break;
                }
                case 'chat': addChatMessage(data.username, data.message); break;
            }
        }
