        function updateSpectate(delta) {
            camera.rotation.order = 'YXZ';
            camera.rotation.y = GameState.yaw;
            camera.rotation.x = GameState.pitch;
            camera.rotation.z = 0;

            const speed = 6;
            const forward = _tmpV1.set(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            const right = _tmpV2.set(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            let mx = 0, mz = 0;
            if (GameState.keys.w) mz += 1;
            if (GameState.keys.s) mz -= 1;
            if (GameState.keys.a) mx -= 1;
            if (GameState.keys.d) mx += 1;
            if (mx !== 0 || mz !== 0) {
                const len = Math.sqrt(mx * mx + mz * mz);
                mx /= len; mz /= len;
                camera.position.x += (forward.x * mz + right.x * mx) * speed * delta;
                camera.position.z += (forward.z * mz + right.z * mx) * speed * delta;
            }
            camera.position.y = CAMERA_HEIGHT_STAND;
            camera.position.x = Math.max(-HALF_MAP, Math.min(HALF_MAP, camera.position.x));
            camera.position.z = Math.max(-HALF_MAP, Math.min(HALF_MAP, camera.position.z));
        }

        function updateLocalPlayer(delta) {
            const local = players[localPeerId];
            if (!local || local.isDead) {
                fpsPistol.group.visible = false;
                fpsSniper.group.visible = false;
                fpsBomb.group.visible = false;
                GameState.isSprinting = false;
                return;
            }
            if (GameState.paused) return;

            const isFirstPerson = GameState.cameraMode === 'first';
            fpsPistol.group.visible = isFirstPerson && GameState.currentSlot === 1;
            fpsSniper.group.visible = isFirstPerson && GameState.currentSlot === 2;
            fpsBomb.group.visible = isFirstPerson && GameState.currentSlot === 3;
            local.mesh.visible = !isFirstPerson;

            const w = WEAPONS[GameState.currentSlot];
            const onLadderNow = isOnLadder(local.position.x, local.position.z, local.position.y);
            GameState.onLadder = onLadderNow;

            const isForward = GameState.keys.w;
            const groundSprint = GameState.keys.shift && GameState.isGrounded && !GameState.mouseDown && isForward && !GameState.isProne && w.canSprint && !onLadderNow;
            const airSprint = GameState.keys.shift && !GameState.isGrounded && isForward && !GameState.isProne && w.canSprint && !onLadderNow;
            GameState.isSprinting = groundSprint || airSprint;
            const targetBlend = GameState.isSprinting ? 1 : 0;
            GameState.sprintBlend += (targetBlend - GameState.sprintBlend) * Math.min(delta * 10, 1);

            const camQ = camera.quaternion;
            _tmpV1.set(0, 0, -1).applyQuaternion(camQ);
            _tmpV1.y = 0; _tmpV1.normalize();
            _tmpV2.set(1, 0, 0).applyQuaternion(camQ);
            _tmpV2.y = 0; _tmpV2.normalize();

            let moveX = 0, moveZ = 0;
            if (GameState.keys.a) moveX -= 1;
            if (GameState.keys.d) moveX += 1;
            if (!onLadderNow) {
                if (GameState.keys.w) moveZ += 1;
                if (GameState.keys.s) moveZ -= 1;
            }

            const baseSpeed = 5.5;
            let speedMult = 1.0;
            if (GameState.isProne) speedMult = 0.4;
            else if (groundSprint) speedMult = 1.8;
            else if (airSprint) speedMult = 1.35;
            if (GameState.isADS) speedMult *= 0.5;

            const isMoving = (moveX !== 0 || moveZ !== 0);
            if (isMoving) {
                const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX /= len; moveZ /= len;
                const dirX = _tmpV1.x * moveZ + _tmpV2.x * moveX;
                const dirZ = _tmpV1.z * moveZ + _tmpV2.z * moveX;
                const dLen = Math.sqrt(dirX * dirX + dirZ * dirZ);
                if (dLen > 0.001) {
                    local.position.x += (dirX / dLen) * baseSpeed * speedMult * delta;
                    local.position.z += (dirZ / dLen) * baseSpeed * speedMult * delta;
                }
            }

            if (onLadderNow && !GameState.isProne) {
                if (GameState.keys.w || GameState.keys.space) GameState.verticalVelocity = 4;
                else if (GameState.keys.s) GameState.verticalVelocity = -4;
                else GameState.verticalVelocity = 0;
                GameState.isGrounded = true;
            } else {
                if (GameState.keys.space && GameState.isGrounded && !GameState.isProne) {
                    GameState.verticalVelocity = 7.0;
                    GameState.isGrounded = false;
                    sound.jump();
                }
                GameState.verticalVelocity -= 22 * delta;
            }
            local.position.y += GameState.verticalVelocity * delta;

            const bound = HALF_MAP - 0.5;
            local.position.x = Math.max(-bound, Math.min(bound, local.position.x));
            local.position.z = Math.max(-bound, Math.min(bound, local.position.z));
            const playerHeight = GameState.isProne ? 0.9 : 1.8;
            resolveWallCollision(local.position, 0.45, playerHeight);

            const roofY = getRoofHeight(local.position.x, local.position.z, local.position.y);
            const groundY = Math.max(0, roofY);
            if (local.position.y <= groundY) {
                local.position.y = groundY;
                GameState.verticalVelocity = 0;
                GameState.isGrounded = true;
            } else {
                if (!(onLadderNow && (GameState.keys.w || GameState.keys.space))) GameState.isGrounded = false;
            }

            local.mesh.position.copy(local.position);
            const baseYaw = GameState.yaw + Math.PI;
            if (GameState.isProne) {
                local.mesh.rotation.order = 'YXZ';
                local.mesh.rotation.set(Math.PI / 2, baseYaw, 0);
                local.mesh.position.y = 0.35;
            } else {
                local.mesh.rotation.order = 'YXZ';
                local.mesh.rotation.set(0, baseYaw, 0);
            }

            updateWalkAnimation(local, isMoving, delta, GameState.isSprinting);

            if (conn && conn.open && (GameState.frame % SYNC_INTERVAL === 0)) {
                conn.send({
                    type: 'move',
                    peerId: localPeerId,
                    position: local.position.toArray(),
                    rotation: [local.mesh.rotation.x, local.mesh.rotation.y, local.mesh.rotation.z],
                    isSprinting: GameState.isSprinting,
                });
            }

            for (const pid in players) {
                if (pid === localPeerId) continue;
                const rp = players[pid];
                if (!rp.isDead) updateWalkAnimation(rp, rp._isMoving, delta, rp._isSprinting);
            }

            const wantADS = GameState.currentSlot === 2 && GameState.rightMouseDown && !GameState.isReloading;
            GameState.isADS = wantADS;
            const adsTarget = wantADS ? 1 : 0;
            GameState.adsBlend += (adsTarget - GameState.adsBlend) * Math.min(delta * 8, 1);
            const newFov = BASE_FOV - GameState.adsBlend * 40;
            if (Math.abs(camera.fov - newFov) > 0.1) {
                camera.fov = newFov;
                camera.updateProjectionMatrix();
            }
            crosshair.classList.toggle('scoped', GameState.adsBlend > 0.5);

            if (GameState.keys.r && !GameState.isReloading && !w.isBomb && GameState.weaponAmmo[GameState.currentSlot] < w.maxAmmo) {
                GameState.isReloading = true;
                GameState.reloadTimer = 0;
                GameState.reloadTime = w.reloadTime;
                sound.reload();
                reloadProgress.classList.add('active');
            }
            if (GameState.isReloading) {
                GameState.reloadTimer++;
                if (GameState.reloadTimer >= GameState.reloadTime) {
                    GameState.isReloading = false;
                    GameState.weaponAmmo[GameState.currentSlot] = w.maxAmmo;
                    sound.reloadComplete();
                    reloadProgress.classList.remove('active');
                    reloadBar.style.width = '0%';
                    _hudCache.reloadActive = false;
                    updateHUD();
                }
            }

            if (GameState.mouseDown && GameState.shootCooldown <= 0 && !GameState.isReloading && !w.isBomb && GameState.weaponAmmo[GameState.currentSlot] > 0) {
                GameState.weaponAmmo[GameState.currentSlot]--;
                GameState.shootCooldown = w.fireRate;
                GameState.lastFireTime = performance.now();
                if (GameState.currentSlot === 2) sound.sniperShot(); else sound.shoot();

                const fw = getFPSWeapon(GameState.currentSlot);
                if (fw.flashSprite) { fw.flashSprite.visible = true; fw.flashSprite.scale.set(0.5, 0.5, 0.5); }
                setTimeout(() => {
                    if (fw.flashSprite) { fw.flashSprite.visible = false; fw.flashSprite.scale.set(0.01, 0.01, 0.01); }
                }, 50);
                gunRecoilZ = -0.15; gunRecoilY = 0.08;

                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                const origin = camera.position.clone().add(dir.clone().multiplyScalar(0.7));
                createBullet(origin, dir, localPeerId, w.bulletSpeed, w.damage, GameState.currentSlot === 2);
                if (conn && conn.open) {
                    conn.send({ type: 'shoot', peerId: localPeerId, origin: origin.toArray(), direction: dir.toArray(), isSniper: GameState.currentSlot === 2 });
                }
                _hudCache.ammo = -1;
                updateHUD();
            }
            if (GameState.shootCooldown > 0) GameState.shootCooldown--;

            if (GameState.rightMouseDown && GameState.currentSlot === 3) {
                const remain = GameState.bombCooldownEnd - performance.now();
                if (remain <= 0 && !GameState._bombConsumed) {
                    GameState._bombConsumed = true;
                    GameState.bombCooldownEnd = performance.now() + WEAPONS[3].cooldown;
                    const dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);
                    const origin = camera.position.clone().add(dir.clone().multiplyScalar(0.6));
                    throwBomb(origin, dir, localPeerId);
                    if (conn && conn.open) {
                        conn.send({ type: 'bomb_throw', peerId: localPeerId, origin: origin.toArray(), direction: dir.toArray() });
                    }
                    updateHotbarUI();
                    _hudCache.cooldown = -1;
                    updateHUD();
                }
            }
            if (!GameState.rightMouseDown) GameState._bombConsumed = false;

            gunRecoilZ *= 0.82; gunRecoilY *= 0.82;

            let gunAnimY = 0, gunAnimRotZ = 0, gunAnimRotX = 0;
            if (GameState.isReloading) {
                const progress = GameState.reloadTimer / GameState.reloadTime;
                let upAmount;
                if (progress < 0.2) upAmount = progress / 0.2;
                else if (progress < 0.8) upAmount = 1;
                else upAmount = (1 - progress) / 0.2;
                gunAnimY = upAmount * 0.35;
                gunAnimRotZ = upAmount * -0.6;
                gunAnimRotX = upAmount * 0.4;
            }

            let camShakeX = 0, camShakeY = 0, gunShakeX = 0, gunShakeY = 0;
            if (GameState.sprintBlend > 0.01 && !GameState.isProne) {
                GameState.sprintBobTime += delta * 14 * GameState.sprintBlend;
                const t = GameState.sprintBobTime;
                camShakeX = Math.sin(t) * 0.055 * GameState.sprintBlend;
                camShakeY = Math.abs(Math.cos(t)) * 0.045 * GameState.sprintBlend;
                gunShakeX = Math.sin(t) * 0.05 * GameState.sprintBlend;
                gunShakeY = Math.abs(Math.cos(t * 0.9)) * 0.04 * GameState.sprintBlend;
            } else { GameState.sprintBobTime = 0; }

            if (GameState.hitShake > 0) {
                const intensity = GameState.hitShake * 0.3;
                camShakeX += (Math.random() - 0.5) * intensity;
                camShakeY += (Math.random() - 0.5) * intensity * 0.5;
                GameState.hitShake *= 0.9;
                if (GameState.hitShake < 0.001) GameState.hitShake = 0;
            }

            const targetGun = getFPSWeapon(GameState.currentSlot);
            if (targetGun && targetGun.group) {
                const baseX = GUN_BASE.x + gunShakeX;
                const baseY = GUN_BASE.y + gunShakeY + gunRecoilY + gunAnimY;
                const baseZ = GUN_BASE.z + gunRecoilZ;

                if (GameState.currentSlot === 2 && GameState.adsBlend > 0.001) {
                    const t = GameState.adsBlend;
                    targetGun.group.position.set(
                        baseX * (1 - t),
                        baseY * (1 - t) + (-0.25) * t,
                        baseZ * (1 - t) + (-0.5) * t
                    );
                    let s = 0.8;
                    if (t > 0.7) s = 0.8 * Math.max(0, 1 - (t - 0.7) / 0.3);
                    targetGun.group.scale.set(s, s, s);
                } else {
                    targetGun.group.position.set(baseX, baseY, baseZ);
                    targetGun.group.scale.set(0.8, 0.8, 0.8);
                }
                targetGun.group.rotation.z = gunAnimRotZ;
                targetGun.group.rotation.x = gunAnimRotX;
            }

            if (fpsBomb.led) {
                const blink = Math.sin(performance.now() * 0.01) > 0 ? 0xff2222 : 0x660000;
                fpsBomb.led.material.color.setHex(blink);
            }

            const camHeight = GameState.isProne ? CAMERA_HEIGHT_PRONE : CAMERA_HEIGHT_STAND;
            if (isFirstPerson) {
                camera.position.set(local.position.x, local.position.y + camHeight, local.position.z);
                camera.rotation.order = 'YXZ';
                camera.rotation.y = GameState.yaw;
                camera.rotation.x = GameState.pitch;
                camera.rotation.z = 0;
            } else {
                const dist = 5.5;
                const yaw = GameState.yaw, pitch = GameState.pitch;
                const cosP = Math.cos(pitch);
                const camX = local.position.x + Math.sin(yaw) * dist * cosP;
                const camY = local.position.y + camHeight + 0.6 - Math.sin(pitch) * dist;
                const camZ = local.position.z + Math.cos(yaw) * dist * cosP;
                camera.position.set(camX, camY, camZ);
                const targetY = local.position.y + (GameState.isProne ? 0.4 : 1.2);
                camera.lookAt(local.position.x, targetY, local.position.z);
            }
            camera.position.x += camShakeX;
            camera.position.y += camShakeY;

            const now = performance.now();
            const canRegen = local.hp < 75 && !GameState.isSprinting && !GameState.mouseDown && !GameState.isReloading &&
                (now - GameState.lastDamageTime > 5000) && (now - GameState.lastFireTime > 5000) && now >= GameState.nextRegenTime;
            if (canRegen) {
                local.hp = Math.min(75, local.hp + 5);
                GameState.nextRegenTime = now + 5000;
                _hudCache.hp = -1;
                _hudCache.hpPercent = -1;
                updateHUD();
                regenIndicator.classList.add('active');
                setTimeout(() => regenIndicator.classList.remove('active'), 800);
            }

            updateHUD();
            updateHotbarUI();
        }

        // ================================================================
        //  主循环
        // ================================================================
        let frame = 0;
        let lastTime = performance.now();
        let fpsTimer = 0, fpsFrames = 0, fpsValue = 60;

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;
            frame++;
            GameState.frame = frame;

            fpsFrames++;
            fpsTimer += delta;
            if (fpsTimer >= 1) {
                fpsValue = fpsFrames / fpsTimer;
                fpsFrames = 0;
                fpsTimer = 0;
                if (GameState.showPerf) {
                    perfMonitor.textContent = `FPS: ${fpsValue.toFixed(0)} | 实体: ${bullets.length + bombs.length + explosions.length} | 玩家: ${Object.keys(players).length}`;
                }
            }

            if (GameState.spectating && !GameState.paused) {
                updateSpectate(delta);
            } else if (players[localPeerId] && !GameState.paused) {
                updateLocalPlayer(delta);
            }

            if (!GameState.paused) {
                updateBullets(delta);
                updateBombs(delta);
                updateExplosions(delta);
                updateInvulnerabilityEffects();

                if (frame % LABEL_CHECK_INTERVAL === 0) {
                    const camPos = camera.position;
                    for (const pid in players) {
                        if (pid === localPeerId) continue;
                        const p = players[pid];
                        const hideAll = p.isDead || p.isProne;
                        if (p.meshData) {
                            if (p.meshData.label) {
                                if (hideAll) p.meshData.label.visible = false;
                                else {
                                    const wp = _tmpV1;
                                    p.meshData.label.getWorldPosition(wp);
                                    p.meshData.label.visible = !isLabelOccluded(wp, camPos);
                                }
                            }
                            if (p.meshData.hpLabel) {
                                if (hideAll) p.meshData.hpLabel.visible = false;
                                else {
                                    const wp = _tmpV2;
                                    p.meshData.hpLabel.getWorldPosition(wp);
                                    p.meshData.hpLabel.visible = !isLabelOccluded(wp, camPos);
                                }
                            }
                        }
                    }
                }
            }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        function setMobileMode(enabled) {
            GameState.mobileMode = enabled;
            pcModeBtn.classList.toggle('active', !enabled);
            mobileModeBtn.classList.toggle('active', enabled);
            if (enabled) document.body.classList.add('mobile-mode');
            else document.body.classList.remove('mobile-mode');
        }
        pcModeBtn.addEventListener('click', () => setMobileMode(false));
        mobileModeBtn.addEventListener('click', () => setMobileMode(true));

        const joystick = { active: false, id: null, centerX: 0, centerY: 0, maxDist: 50 };

        function resetJoystickKnob() {
            joystickKnob.style.transform = 'translate(-50%, -50%)';
            GameState.keys.w = false; GameState.keys.s = false;
            GameState.keys.a = false; GameState.keys.d = false;
        }

        joystickZone.addEventListener('touchstart', (e) => {
            if (!GameState.mobileMode || GameState.paused || GameState.isDead || GameState.spectating) return;
            e.preventDefault();
            const touch = e.changedTouches[0];
            const rect = joystickZone.getBoundingClientRect();
            joystick.active = true;
            joystick.id = touch.identifier;
            joystick.centerX = rect.left + rect.width / 2;
            joystick.centerY = rect.top + rect.height / 2;
            updateJoystick(touch.clientX, touch.clientY);
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
            if (!joystick.active) return;
            e.preventDefault();
            for (const touch of e.changedTouches) {
                if (touch.identifier === joystick.id) updateJoystick(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        joystickZone.addEventListener('touchend', (e) => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === joystick.id) {
                    joystick.active = false;
                    joystick.id = null;
                    resetJoystickKnob();
                }
            }
        });
        joystickZone.addEventListener('touchcancel', () => {
            joystick.active = false;
            joystick.id = null;
            resetJoystickKnob();
        });

        function updateJoystick(touchX, touchY) {
            let dx = touchX - joystick.centerX;
            let dy = touchY - joystick.centerY;
            const dist = Math.hypot(dx, dy);
            const maxD = joystick.maxDist;
            if (dist > maxD) {
                const ratio = maxD / dist;
                dx *= ratio; dy *= ratio;
            }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

            const deadzone = 12;
            const absX = Math.abs(dx), absY = Math.abs(dy);
            const threshold = 0.4;

            GameState.keys.a = dx < -deadzone && absX > absY * threshold;
            GameState.keys.d = dx > deadzone && absX > absY * threshold;
            GameState.keys.w = dy < -deadzone && absY > absX * threshold;
            GameState.keys.s = dy > deadzone && absY > absX * threshold;
        }

        const mobSprint = document.getElementById('mobSprint');
        const mobADS = document.getElementById('mobADS');
        const mobProne = document.getElementById('mobProne');
        const mobJump = document.getElementById('mobJump');
        const mobShoot = document.getElementById('mobShoot');
        const mobReload = document.getElementById('mobReload');

        function bindHold(el, onPress, onRelease, toggle = false) {
            let pressed = false;
            function press(e) {
                e.preventDefault(); e.stopPropagation();
                if (toggle) {
                    pressed = !pressed;
                    el.classList.toggle('pressed', pressed);
                    onPress(pressed);
                } else {
                    if (pressed) return;
                    pressed = true;
                    el.classList.add('pressed');
                    onPress();
                }
            }
            function release(e) {
                if (toggle) return;
                e.preventDefault(); e.stopPropagation();
                if (!pressed) return;
                pressed = false;
                el.classList.remove('pressed');
                if (onRelease) onRelease();
            }
            el.addEventListener('touchstart', press, { passive: false });
            el.addEventListener('touchend', release, { passive: false });
            el.addEventListener('touchcancel', release, { passive: false });
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        }

        bindHold(mobSprint, () => { GameState.keys.shift = true; }, () => { GameState.keys.shift = false; });
        bindHold(mobADS, () => { GameState.rightMouseDown = true; }, () => { GameState.rightMouseDown = false; });
        bindHold(mobProne, () => {
            if (GameState.isDead || GameState.spectating) return;
            GameState.isProne = !GameState.isProne;
            stanceIndicator.classList.toggle('active', GameState.isProne);
            mobProne.classList.toggle('pressed', GameState.isProne);
        }, null, true);
        bindHold(mobJump, () => { GameState.keys.space = true; }, () => { GameState.keys.space = false; });
        bindHold(mobShoot, () => { GameState.mouseDown = true; }, () => { GameState.mouseDown = false; });

        mobReload.addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (GameState.isDead || GameState.spectating) return;
            GameState.keys.r = true;
            setTimeout(() => { GameState.keys.r = false; }, 100);
        });
        mobReload.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (GameState.isDead || GameState.spectating) return;
            GameState.keys.r = true;
            setTimeout(() => { GameState.keys.r = false; }, 100);
        }, { passive: false });

        const touchLook = { active: false, id: null, lastX: 0, lastY: 0 };
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (!GameState.mobileMode || GameState.paused || GameState.isDead) return;
            for (const touch of e.changedTouches) {
                if (!touchLook.active) {
                    touchLook.active = true;
                    touchLook.id = touch.identifier;
                    touchLook.lastX = touch.clientX;
                    touchLook.lastY = touch.clientY;
                }
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (!GameState.mobileMode || GameState.paused || GameState.isDead) return;
            for (const touch of e.changedTouches) {
                if (touch.identifier === touchLook.id) {
                    const dx = touch.clientX - touchLook.lastX;
                    const dy = touch.clientY - touchLook.lastY;
                    touchLook.lastX = touch.clientX;
                    touchLook.lastY = touch.clientY;
                    const sensMul = GameState.adsBlend > 0.5 ? 0.3 : 1;
                    GameState.yaw -= dx * MOBILE_LOOK_SENS * sensMul;
                    GameState.pitch -= dy * MOBILE_LOOK_SENS * sensMul;
                    GameState.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, GameState.pitch));
                }
            }
            e.preventDefault();
        }, { passive: false });

        renderer.domElement.addEventListener('touchend', (e) => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === touchLook.id) {
                    touchLook.active = false;
                    touchLook.id = null;
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.addEventListener('keydown', (e) => {
            if (chatInputActive) return;
            const key = e.key.toLowerCase();
            const code = e.code;

            if (key === 'w') GameState.keys.w = true;
            if (key === 'a') GameState.keys.a = true;
            if (key === 's') GameState.keys.s = true;
            if (key === 'd') GameState.keys.d = true;
            if (key === ' ' || key === 'space') { e.preventDefault(); GameState.keys.space = true; }
            if (key === 'r') { e.preventDefault(); GameState.keys.r = true; }
            if (key === 'shift') GameState.keys.shift = true;

            if (code === 'Digit1') switchWeapon(1);
            if (code === 'Digit2') switchWeapon(2);
            if (code === 'Digit3') switchWeapon(3);

            if (key === 'p') {
                GameState.showPerf = !GameState.showPerf;
                perfMonitor.classList.toggle('show', GameState.showPerf);
            }

            if (key === 'z' && !GameState.isDead && uiOverlay.classList.contains('hidden') && !GameState.paused && !GameState.spectating) {
                GameState.isProne = !GameState.isProne;
                stanceIndicator.classList.toggle('active', GameState.isProne);
            }
            if (key === 'y' && !GameState.isDead && uiOverlay.classList.contains('hidden') && !GameState.paused && !GameState.spectating) {
                GameState.cameraMode = GameState.cameraMode === 'first' ? 'third' : 'first';
            }
            if (key === 'escape') {
                if (!uiOverlay.classList.contains('hidden')) return;
                if (GameState.isDead) return;
                if (GameState.paused) resumeGame(); else pauseGame();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') GameState.keys.w = false;
            if (key === 'a') GameState.keys.a = false;
            if (key === 's') GameState.keys.s = false;
            if (key === 'd') GameState.keys.d = false;
            if (key === ' ' || key === 'space') GameState.keys.space = false;
            if (key === 'r') GameState.keys.r = false;
            if (key === 'shift') GameState.keys.shift = false;
        });

        document.addEventListener('wheel', (e) => {
            if (!GameState.isLocked || chatInputActive || GameState.isDead || GameState.paused || GameState.mobileMode) return;
            if (!uiOverlay.classList.contains('hidden')) return;
            e.preventDefault();
            if (e.deltaY > 0) {
                let next = GameState.currentSlot + 1;
                if (next > 3) next = 1;
                switchWeapon(next);
            } else if (e.deltaY < 0) {
                let prev = GameState.currentSlot - 1;
                if (prev < 1) prev = 3;
                switchWeapon(prev);
            }
        }, { passive: false });

        renderer.domElement.addEventListener('click', () => {
            if (GameState.mobileMode) return;
            if (!GameState.isLocked && !chatInputActive && (!GameState.isDead || GameState.spectating) && !GameState.paused && uiOverlay.classList.contains('hidden')) {
                renderer.domElement.requestPointerLock();
                sound.resume();
            }
        });
        document.addEventListener('pointerlockchange', () => {
            if (GameState.mobileMode) { GameState.isLocked = true; return; }
            GameState.isLocked = document.pointerLockElement === renderer.domElement;
            if (!GameState.isLocked && !GameState.paused && !GameState.isDead && uiOverlay.classList.contains('hidden') && !chatInputActive && !GameState.spectating) pauseGame();
        });

        let pendingMouseX = 0, pendingMouseY = 0, hasPendingMouse = false;
        document.addEventListener('mousemove', (e) => {
            if (GameState.mobileMode) return;
            if (!GameState.isLocked) return;
            pendingMouseX += (e.movementX || 0);
            pendingMouseY += (e.movementY || 0);
            hasPendingMouse = true;
        });

        function applyMouseDelta() {
            if (!hasPendingMouse) return;
            hasPendingMouse = false;
            const sensMul = GameState.adsBlend > 0.5 ? 0.3 : 1;
            const sens = 0.002 * sensMul;
            GameState.yaw -= pendingMouseX * sens;
            GameState.pitch -= pendingMouseY * sens;
            GameState.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, GameState.pitch));
            pendingMouseX = 0;
            pendingMouseY = 0;
        }

        setInterval(applyMouseDelta, 1000 / 60);

        document.addEventListener('mousedown', (e) => {
            if (GameState.mobileMode) return;
            if (!GameState.isLocked || chatInputActive || GameState.paused) return;
            if (GameState.spectating || GameState.isDead) return;
            if (e.button === 0) GameState.mouseDown = true;
            if (e.button === 2) GameState.rightMouseDown = true;
        });
        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) GameState.mouseDown = false;
            if (e.button === 2) GameState.rightMouseDown = false;
        });
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        document.addEventListener('keydown', (e) => {
            if (e.key === 't' || e.key === 'T') {
                if (!chatInputActive && !uiOverlay.classList.contains('hidden')) return;
                if (GameState.paused) return;
                e.preventDefault();
                chatInputActive = !chatInputActive;
                if (chatInputActive) {
                    chatInputContainer.style.display = 'block';
                    chatInput.value = '';
                    chatInput.focus();
                    if (document.pointerLockElement && !GameState.mobileMode) document.exitPointerLock();
                } else {
                    chatInputContainer.style.display = 'none';
                    if (!GameState.isLocked && !GameState.mobileMode && (!GameState.isDead || GameState.spectating)) renderer.domElement.requestPointerLock();
                }
            }
        });
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const msg = chatInput.value.trim();
                if (msg) sendChatMessage(msg);
                chatInputActive = false;
                chatInputContainer.style.display = 'none';
                if (!GameState.isLocked && !GameState.mobileMode && (!GameState.isDead || GameState.spectating)) renderer.domElement.requestPointerLock();
                e.preventDefault();
            } else if (e.key === 'Escape') {
                chatInputActive = false;
                chatInputContainer.style.display = 'none';
            }
        });

        console.log('🎮 巴迪老师枪战 v9 (网络修复版)');
        console.log('已配置 STUN 服务器 · 有超时保护 · 按 P 显示性能监控');
    </script>
</body>
